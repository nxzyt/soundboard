<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Soundboard</title>
</head>
   <script>
    // Helper function to play and reset audio so you can spam the key
    function playSound(soundId) {
      const sound = document.getElementById(soundId);
      if (sound) {
        sound.currentTime = 0; // Rewinds to start
        sound.play();
      }
    }
<body>

  <!-- 1. YOUR BUTTONS AND AUDIO TAGS GO HERE -->
  <button id="btn-Dry Fart" onclick="playSound('Dry Fart')">Dry Fart [1]</button>
  <button id="btn-FAHHH" onclick="playSound('fahhhhhhhhhhhhhh')">FAHHH [2]</button>

  <audio id="dry-fart" src="dry-fart.mp3"></audio>
  <audio id="fahhhhhhhhhhhhhh" src="fahhhhhhhhhhhhhh.mp3"></audio>


    // Listen for keyboard presses anywhere on the page
    document.addEventListener('keydown', function(event) {
      // Ignore key presses if the user is typing in an input box
      if (event.target.tagName === 'INPUT') return;

      // Map keys (lowercase) to your <audio> element IDs
      const keyMap = {
        '1': 'Dry Fart',
        '2': 'fahhhhhhhhhhhhhh',
        'q': 'airhorn', // You can map letters too
        ' ': 'bruh'     // Spacebar
      };

      const soundId = keyMap[event.key.toLowerCase()];
      
      if (soundId) {
        playSound(soundId);
      }
    });
  </script>

</body>
</html>
